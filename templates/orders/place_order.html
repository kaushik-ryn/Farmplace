<h2>Place Order</h2>

<p>
    Crop: <strong>{{ crop.name }}</strong><br>
    Price: ₹{{ crop.price_per_kg }} / kg<br>
    Available: {{ crop.quantity }} kg
</p>

<form method="post">
    {% csrf_token %}
    <label>Quantity (kg):</label>
    <input type="number" name="quantity" min="1" max="{{ crop.quantity }}" required>
    <br><br>
    <button type="submit">Confirm Order</button>
</form>
