<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Edit Crop | FarmPlace</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #ecfeff, #f0fdfa);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #0f172a;
}

/* CARD */
.edit-card {
    width: 420px;
    background: white;
    border-radius: 22px;
    padding: 30px 32px;
    box-shadow: 0 20px 45px rgba(0,0,0,0.12);
    animation: fadeUp 0.4s ease;
}

/* HEADER */
.edit-card h2 {
    text-align: center;
    margin-bottom: 6px;
    font-size: 26px;
    color: #0f766e;
}

.edit-card p {
    text-align: center;
    font-size: 14px;
    color: #64748b;
    margin-bottom: 22px;
}

/* FORM */
.form-group {
    margin-bottom: 15px;
}

label {
    font-size: 13px;
    font-weight: 500;
    color: #334155;
}

input {
    width: 100%;
    padding: 12px 14px;
    margin-top: 6px;
    border-radius: 10px;
    border: 1.5px solid #e2e8f0;
    font-size: 14px;
    transition: 0.25s;
}

input:focus {
    outline: none;
    border-color: #14b8a6;
    box-shadow: 0 0 0 3px rgba(20,184,166,0.15);
}

/* BUTTONS */
.btn-primary {
    width: 100%;
    margin-top: 15px;
    padding: 13px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(135deg, #0f766e, #14b8a6);
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
}

.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(15,118,110,0.3);
}

/* BACK LINK */
.back-link {
    display: block;
    text-align: center;
    margin-top: 18px;
    font-size: 14px;
    color: #0f766e;
    text-decoration: none;
    font-weight: 500;
}

.back-link:hover {
    color: #115e59;
    
}

/* ANIMATION */
@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(15px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>
</head>

<body>

<div class="edit-card">
    <h2><i class="fa-solid fa-seedling"></i> Edit Crop</h2>
    <p>Update your crop details accurately</p>

    <form method="post">
        {% csrf_token %}

        <div class="form-group">
            <label>Crop Name</label>
            <input type="text" name="name" value="{{ crop.name }}" required>
        </div>

        <div class="form-group">
            <label>Price per kg (₹)</label>
            <input type="number" name="price" value="{{ crop.price_per_kg }}" required>
        </div>

        <div class="form-group">
            <label>Available Quantity (kg)</label>
            <input type="number" name="quantity" value="{{ crop.quantity }}" required>
        </div>

        <button type="submit" class="btn-primary">
            Save Changes
        </button>
    </form>

    <a href="{% url 'farmer_dashboard' %}" class="back-link" 
         style="align-items:center;gap:6px;">
         <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
        <path d="M15 18l-6-6 6-6"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"/>
    </svg> Back to Dashboard
    </a>
</div>

</body>
</html>
