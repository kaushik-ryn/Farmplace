<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Update Location | FarmPlace</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Poppins', sans-serif;
    background: #f0fdfa;
    margin: 0;
    color: #0f172a;
}

/* ===== HEADER ===== */
.header {
    background: linear-gradient(135deg,#0f766e,#14b8a6);
    color: white;
    padding: 50px 60px;
    text-align: center;
    border-bottom-left-radius: 20px;
    border-bottom-right-radius: 20px;
}
.header h2 {
    margin: 0;
    font-size: 32px;
}
.header p {
    margin-top: 6px;
    opacity: 0.9;
}

/* ===== FORM CARD ===== */
.form-card {
    max-width: 500px;
    margin: 40px auto;
    background: white;
    padding: 30px 40px;
    border-radius: 18px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.08);
    animation: fadeIn 0.6s ease;
}
@keyframes fadeIn {
    from {opacity: 0; transform: translateY(15px);}
    to {opacity: 1; transform: translateY(0);}
}

.form-card label {
    display: block;
    font-weight: 500;
    margin-bottom: 6px;
    color: #0f766e;
}

.form-card input {
    width: 100%;
    padding: 12px 14px;
    margin-bottom: 18px;
    border-radius: 10px;
    border: 1px solid #cbd5e1;
    transition: 0.3s;
    font-size: 15px;
}
.form-card input:focus {
    outline: none;
    border-color: #14b8a6;
    box-shadow: 0 0 8px rgba(20,184,166,0.2);
}

.form-card button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg,#0f766e,#14b8a6);
    color: white;
    font-weight: 600;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}
.form-card button:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
}

/* ===== BACK LINK ===== */
.back-link {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #0f766e;
    font-weight: 500;
    text-decoration: none;
    transition: 0.25s;
}
.back-link:hover {
    color: #14b8a6;
    text-decoration: underline;
}

/* ===== RESPONSIVE ===== */
@media(max-width:600px){
    .header {
        padding: 35px 20px;
    }
    .form-card {
        padding: 25px 20px;
    }
}
</style>
</head>
<body>

<div class="header">
    <h2>📍 Update Location</h2>
    <p>Keep your farm details up-to-date</p>
</div>

<div class="form-card">
    <form method="post">
        {% csrf_token %}
        
        <label>Location (Village / City / Area):</label>
        <input type="text" name="location" value="{{ farmer.location }}" required>

        <label>Phone Number:</label>
        <input type="text" name="phone" value="{{ farmer.phone }}">

        <button type="submit">Save Location</button>
    </form>

    <a class="back-link" href="{% url 'farmer_dashboard' %}">← Back to Dashboard</a>
</div>

</body>
</html>
