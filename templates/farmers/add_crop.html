<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Add Crop | FarmPlace</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Poppins', sans-serif;
    background: #f0fdfa;
    margin: 0;
    color: #0f172a;
}

/* ===== HEADER ===== */
.header {
    background: linear-gradient(135deg,#0f766e,#14b8a6);
    color: white;
    padding: 50px 60px;
    text-align: center;
    border-bottom-left-radius: 20px;
    border-bottom-right-radius: 20px;
}
.header h2 {
    margin: 0;
    font-size: 32px;
}
.header p {
    margin-top: 6px;
    opacity: 0.9;
}

/* ===== FORM CARD ===== */
.form-card {
    max-width: 500px;
    margin: 40px auto;
    background: white;
    padding: 30px 40px;
    border-radius: 18px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.08);
    animation: fadeIn 0.6s ease;
}
@keyframes fadeIn {
    from {opacity: 0; transform: translateY(15px);}
    to {opacity: 1; transform: translateY(0);}
}

.form-card input {
    width: 100%;
    padding: 12px 14px;
    margin-bottom: 18px;
    border-radius: 10px;
    border: 1px solid #cbd5e1;
    transition: 0.3s;
    font-size: 15px;
}
.form-card input:focus {
    outline: none;
    border-color: #14b8a6;
    box-shadow: 0 0 8px rgba(20,184,166,0.2);
}

.form-card button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg,#0f766e,#14b8a6);
    color: white;
    font-weight: 600;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}
.form-card button:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
}

/* ===== BACK LINK ===== */
.back-link {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #0f766e;
    font-weight: 500;
    text-decoration: none;
    transition: 0.25s;
}
.back-link:hover {
    color: #14b8a6;
    
}

/* ===== RESPONSIVE ===== */
@media(max-width:600px){
    .header {
        padding: 35px 20px;
    }
    .form-card {
        padding: 25px 20px;
    }
}
</style>
</head>
<body>

<div class="header">
    <h2> Add New Crop</h2>
    <p>Fill in the details to list your crop</p>
</div>

<div class="form-card">
    <form method="post">
        {% csrf_token %}

        <input type="text" name="name" placeholder="Crop Name" required>
        <input type="number" name="price" placeholder="Price per kg" step="0.01" required>
        <input type="number" name="quantity" placeholder="Quantity (kg)" required>

        <button type="submit">Add Crop</button>
    </form>

    <a class="back-link" style="align-items:center;gap:6px;" href="{% url 'farmer_dashboard' %}"> 
         <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
        <path d="M15 18l-6-6 6-6"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"/>
    </svg> Back to Dashboard</a>
</div>

</body>
</html>
